<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>BEAUX — 100 Memories in the Sky</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;color:#fff;font-family:Georgia,serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}#start,#replay{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:max(34px,env(safe-area-inset-bottom));min-height:58px;padding:0 28px;border:1px solid #f2d38c;border-radius:999px;background:#091326dd;color:#ffe7ad;font:600 14px Arial;letter-spacing:.14em;box-shadow:0 0 40px #dcae5144;cursor:pointer}#replay{display:none}.final{position:fixed;z-index:7;inset:0;display:none;place-items:center;pointer-events:none;text-align:center;font-size:clamp(26px,7vw,64px);letter-spacing:.08em;text-shadow:0 0 30px #e8bd69}.viewer{position:fixed;z-index:10;inset:0;display:none;place-items:center;background:#02050ab8;padding:8vh 7vw}.viewer.show{display:grid}.viewer img{max-width:88vw;max-height:76vh;object-fit:contain;border:1px solid #f4d89c;border-radius:8px;box-shadow:0 0 65px #e5bb7155,0 30px 80px #000}.hint{position:fixed;z-index:6;top:18px;left:0;right:0;text-align:center;font:11px Arial;letter-spacing:.12em;color:#e9d8b7aa;opacity:0;transition:.5s}.hint.on{opacity:1}@media(prefers-reduced-motion:reduce){.hint{display:none}}</style></head><body><canvas id="sky"></canvas><div id="hint" class="hint">TAP A LIGHT TO OPEN A MEMORY • DRAG THE SKY</div><button id="start">LIGHT UP THE SKY</button><button id="replay">REPLAY THE SKY</button><div id="final" class="final">HAPPY BIRTHDAY, BEAUX ✨</div><div id="viewer" class="viewer"><img id="photo" alt="Memory"></div><script src="photos.js"></script><script src="show.js"></script></body></html>
